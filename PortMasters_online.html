<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PortMasters 2 · Maritime Silk Road (2-Player Online)</title>
<style>
/* ============================================================
   PortMasters 2 Design System
   Bright and natural, ocean-glass feel, smooth gradients, near-future (~2030) aesthetic
   Layer hierarchy (low to high): background decor < chat window < fullscreen overlay < dialogs < notifications
   ============================================================ */
:root {
  --z-chat: 900;
  --z-overlay: 1000;
  --z-modal: 2000;
  --z-toast: 3000;

  /* Maritime Silk Road color palette */
  --ocean-950: #082f49;
  --ocean-900: #0c4a6e;
  --ocean-700: #0369a1;
  --ocean-500: #0ea5e9;
  --ocean-300: #7dd3fc;
  --ocean-100: #e0f2fe;
  --teal-500: #14b8a6;
  --teal-300: #5eead4;
  --gold-500: #f59e0b;
  --gold-300: #fcd34d;
  --sand-100: #fef3c7;
  --coral-500: #f43f5e;
  --ink: #0f172a;
  --ink-soft: #475569;
  --ink-faint: #94a3b8;

  --glass: rgba(255, 255, 255, 0.72);
  --glass-strong: rgba(255, 255, 255, 0.88);
  --glass-border: rgba(255, 255, 255, 0.65);

  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;

  --shadow-soft: 0 8px 30px rgba(3, 72, 118, 0.10);
  --shadow-float: 0 16px 44px rgba(3, 72, 118, 0.16);

  --grad-primary: linear-gradient(135deg, #38bdf8, #0284c7);
  --grad-success: linear-gradient(135deg, #34d399, #0d9488);
  --grad-warning: linear-gradient(135deg, #fbbf24, #f97316);
  --grad-danger:  linear-gradient(135deg, #fb7185, #e11d48);
  --grad-gold:    linear-gradient(135deg, #fde68a, #f59e0b);
  --grad-grey:    linear-gradient(135deg, #cbd5e1, #94a3b8);
  --grad-deep:    linear-gradient(120deg, #075985, #0369a1 55%, #0d9488);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
  background:
    linear-gradient(180deg, #f0f9ff 0%, #e0f2fe 38%, #ccfbf1 100%) fixed;
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ---- Background ambient glow (slowly drifting light patches) ---- */
.bg-orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(90px);
  z-index: -1;
  pointer-events: none;
  animation: drift 26s ease-in-out infinite alternate;
}
.orb-1 { width: 520px; height: 520px; background: rgba(125, 211, 252, .55); top: -140px; left: -120px; }
.orb-2 { width: 460px; height: 460px; background: rgba(94, 234, 212, .50); bottom: -160px; right: -100px; animation-delay: -8s; }
.orb-3 { width: 380px; height: 380px; background: rgba(253, 230, 138, .40); top: 38%; left: 58%; animation-delay: -16s; }
@keyframes drift {
  from { transform: translate3d(0, 0, 0) scale(1); }
  to   { transform: translate3d(48px, -36px, 0) scale(1.12); }
}

a { color: var(--ocean-700); }

::selection { background: rgba(56, 189, 248, .30); }

/* ---- Main layout: left = me, center = stage, right = partner ---- */
#app {
  max-width: 1720px;
  margin: 0 auto;
  padding: 14px;
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr) 300px;
  grid-template-rows: auto 1fr auto auto;
  grid-template-areas:
    "header  header  header"
    "me      main    partner"
    "actions actions actions"
    "log     log     log";
  gap: 12px;
  min-height: 100vh;
}

.panel {
  background: var(--glass);
  backdrop-filter: blur(18px) saturate(1.35);
  -webkit-backdrop-filter: blur(18px) saturate(1.35);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-soft);
}

/* ---- Header ---- */
.header {
  grid-area: header;
  background: var(--grad-deep);
  color: #fff;
  padding: 14px 22px;
  border-radius: var(--radius-lg);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  box-shadow: var(--shadow-float);
  position: relative;
  overflow: hidden;
}
.header::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(1100px 130px at 18% -40%, rgba(255,255,255,.22), transparent 60%);
  pointer-events: none;
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand .logo { font-size: 32px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.25)); }
.brand h1 {
  font-size: 22px;
  letter-spacing: .5px;
  background: linear-gradient(120deg, #fff, #fde68a 70%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.brand .gen-badge {
  display: inline-block;
  vertical-align: 3px;
  margin-left: 8px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  color: #451a03;
  background: var(--grad-gold);
  border-radius: 999px;
  padding: 2px 9px;
  -webkit-text-fill-color: #451a03;
  box-shadow: 0 2px 6px rgba(245, 158, 11, .4);
}
.brand .subtitle { color: rgba(224, 242, 254, .9); font-size: 12px; margin-top: 3px; }
.header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; z-index: 1; }
.header-actions .me-chip {
  background: rgba(255,255,255,.16);
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 12px;
  font-weight: 600;
}

/* ---- Sidebars (both players' fleet status) ---- */
.side-panel {
  padding: 14px;
  overflow-y: auto;
  max-height: calc(100vh - 250px);
}
#status-panel { grid-area: me; }
#roster-panel { grid-area: partner; }

/* ---- Roster widgets: every other player in the room, collapsed by default ---- */
.roster-widget {
  background: rgba(255,255,255,.6);
  border: 1px solid rgba(14, 165, 233, .18);
  border-radius: var(--radius-md);
  margin-bottom: 10px;
  overflow: hidden;
}
.roster-widget-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  cursor: pointer;
}
.roster-widget-head:hover { background: rgba(14, 165, 233, .08); }
.roster-widget-stats { display: flex; align-items: center; gap: 10px; margin-left: auto; font-size: 12px; white-space: nowrap; }
.roster-toggle { font-size: 13px; color: var(--ink-soft); }

.crew-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-bottom: 10px;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(14, 165, 233, .18);
}
.crew-head .avatar {
  width: 38px; height: 38px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  background: var(--grad-primary);
  box-shadow: 0 4px 10px rgba(2, 132, 199, .3);
}
.crew-head.partner .avatar { background: var(--grad-success); box-shadow: 0 4px 10px rgba(13, 148, 136, .3); }
.crew-head .who { flex: 1; min-width: 0; }
.crew-head .who .nm { font-size: 14px; font-weight: 800; color: var(--ocean-900); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crew-head .who .role { font-size: 10.5px; color: var(--ink-faint); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.dot.on  { background: #10b981; box-shadow: 0 0 0 4px rgba(16, 185, 129, .18); }
.dot.off { background: #94a3b8; box-shadow: 0 0 0 4px rgba(148, 163, 184, .15); }

.status-section {
  background: var(--glass-strong);
  border: 1px solid rgba(14, 165, 233, .14);
  border-radius: var(--radius-md);
  padding: 11px 12px;
  margin-bottom: 10px;
}
.status-section h3 {
  color: var(--ocean-700);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .5px;
  margin-bottom: 7px;
  display: flex; align-items: center; gap: 5px;
}
.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3px 0;
  font-size: 12px;
  color: var(--ink-soft);
}
.stat-value { font-weight: 700; color: var(--ocean-700); }
.stat-money { font-weight: 800; color: #059669; font-size: 14px; }
.stat-score { font-weight: 800; color: #b45309; }

.inv-item { display: flex; align-items: center; padding: 2.5px 0; font-size: 11.5px; }
.inv-item .icon { margin-right: 5px; }
.inv-item .name { flex: 1; font-weight: 600; }
.inv-item .count { font-weight: 800; min-width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
.inv-section-title {
  color: var(--ink-faint);
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 2px;
  padding: 5px 0 3px;
  margin-top: 4px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: linear-gradient(135deg, rgba(56, 189, 248, .13), rgba(20, 184, 166, .13));
  border: 1px solid rgba(14, 165, 233, .25);
  color: var(--ocean-700);
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 11px;
  font-weight: 700;
  margin: 2px 2px 2px 0;
}
.chip.amber {
  background: linear-gradient(135deg, rgba(253, 230, 138, .35), rgba(251, 191, 36, .2));
  border-color: rgba(245, 158, 11, .4);
  color: #92400e;
}
.chip.green {
  background: linear-gradient(135deg, rgba(52, 211, 153, .18), rgba(13, 148, 136, .14));
  border-color: rgba(16, 185, 129, .35);
  color: #047857;
}
.muted { color: var(--ink-faint); font-size: 11px; }

/* ---- Tooltips (recognition over recall: bring the explanation to the user) ----
   One shared bubble is appended to <body> and positioned by JS (see initTooltips).
   The old `.tip::after` pseudo-element was structurally trapped, which is why hints
   were cut off regardless of how the copy was tuned:
     • clipped by every scrolling/clipping ancestor: .side-panel, .phase-panel and
       .card all set `overflow` to something other than visible, and an absolutely
       positioned descendant cannot escape an ancestor's overflow box (no z-index fix
       gets around this);
     • pinned beneath ancestor stacking contexts (.phase-view animation, .card:hover
       transform), so even when it wasn't clipped it could render behind siblings;
     • hard-centered (left:50%) with a fixed max-width and no edge detection, so a
       hint near any viewport edge overflowed, and a width that fit English text
       spilled over in 中文 (and the reverse), the "works in one language only" symptom.
   A body-level position:fixed bubble is measured against the viewport instead, so no
   ancestor can clip it or trap its stacking, and runtime collision detection
   (flip above/below plus horizontal clamp) keeps every hint fully on-screen in both
   languages. Markup is unchanged: any current or future [data-tip] is covered. */
.tip { cursor: help; border-bottom: 1px dashed rgba(100, 116, 139, .55); }

.tip-bubble {
  position: fixed;
  top: 0; left: 0;
  max-width: min(280px, calc(100vw - 20px));
  background: rgba(15, 23, 42, .94);
  color: #f0f9ff;
  font-size: 11px;
  font-weight: 500;
  line-height: 1.55;
  border-radius: 10px;
  padding: 8px 11px;
  white-space: normal;
  overflow-wrap: break-word;
  box-shadow: 0 8px 24px rgba(0,0,0,.25);
  opacity: 0;
  transform: translateY(4px);
  transition: opacity .16s ease, transform .16s ease;
  pointer-events: none;     /* never steal hover from the element underneath */
  z-index: 4000;            /* above every overlay (--z-toast: 3000) */
}
.tip-bubble.tip-hidden { display: none; }
.tip-bubble.tip-show { opacity: 1; transform: translateY(0); }
.tip-bubble::after {        /* caret points back at the hovered element */
  content: "";
  position: absolute;
  left: var(--tip-caret, 50%);
  margin-left: -5px;
  width: 10px; height: 10px;
  background: rgba(15, 23, 42, .94);
  transform: rotate(45deg);
}
.tip-bubble[data-placement="above"]::after { bottom: -4px; }
.tip-bubble[data-placement="below"]::after { top: -4px; }

/* ---- Center stage ---- */
.phase-panel {
  grid-area: main;
  padding: 18px 20px;
  overflow-y: auto;
  max-height: calc(100vh - 250px);
  position: relative;
}
.phase-view { animation: fadeUp .35s ease; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ---- Phase progress (the flow at a glance) ---- */
.stepper {
  display: flex;
  align-items: flex-start;
  margin: 2px 0 16px;
  overflow-x: auto;
  padding: 4px 0 2px;
}
.step { flex: 1; min-width: 60px; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; }
.step::before {
  content: '';
  position: absolute;
  top: 16px; left: -50%;
  width: 100%; height: 3px;
  background: rgba(148, 163, 184, .3);
  z-index: 0;
  border-radius: 2px;
}
.step:first-child::before { display: none; }
.step.done::before { background: linear-gradient(90deg, #34d399, #10b981); }
.step.current::before { background: linear-gradient(90deg, #10b981, #38bdf8); }
.step .bubble {
  width: 33px; height: 33px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: #e2e8f0;
  color: #94a3b8;
  z-index: 1;
  font-size: 14px;
  border: 2px solid #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,.08);
  transition: all .25s ease;
}
.step.done .bubble { background: var(--grad-success); color: #fff; }
.step.current .bubble {
  background: var(--grad-primary);
  color: #fff;
  box-shadow: 0 0 0 6px rgba(56, 189, 248, .18);
  animation: pulse 2.2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 5px rgba(56, 189, 248, .20); }
  50%      { box-shadow: 0 0 0 9px rgba(56, 189, 248, .08); }
}
.step .lbl { font-size: 11px; margin-top: 6px; color: var(--ink-faint); font-weight: 700; }
.step.current .lbl { color: var(--ocean-700); }
.step.done .lbl { color: #0f766e; }

/* ---- Phase info card (what this step is / what to do) ---- */
.phase-brief {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  background: linear-gradient(135deg, rgba(56, 189, 248, .10), rgba(20, 184, 166, .10));
  border: 1px solid rgba(14, 165, 233, .22);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.phase-brief .pb-icon { font-size: 32px; line-height: 1; filter: drop-shadow(0 2px 4px rgba(2,132,199,.25)); }
.phase-brief .pb-text { flex: 1; min-width: 200px; }
.phase-brief h2 { font-size: 18px; color: var(--ocean-900); margin-bottom: 3px; }
.phase-brief p { font-size: 12.5px; color: var(--ink-soft); line-height: 1.65; }
.phase-brief .pb-sync { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

/* ---- Buttons ---- */
.btn {
  --btn-bg: var(--grad-primary);
  --btn-shadow: rgba(2, 132, 199, .28);
  background: var(--btn-bg);
  color: #fff;
  border: none;
  border-radius: 12px;
  padding: 9px 17px;
  font-family: inherit;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  user-select: none;
  box-shadow: 0 3px 10px var(--btn-shadow), inset 0 1px 0 rgba(255,255,255,.28);
  transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
}
.btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px var(--btn-shadow), inset 0 1px 0 rgba(255,255,255,.28); filter: saturate(1.12); }
.btn:active:not(:disabled) { transform: translateY(0) scale(.97); }
.btn:focus-visible { outline: 3px solid rgba(14, 165, 233, .45); outline-offset: 2px; }
.btn:disabled { background: var(--grad-grey); cursor: not-allowed; box-shadow: none; opacity: .75; color: #334155; }
.btn-success { --btn-bg: var(--grad-success); --btn-shadow: rgba(13, 148, 136, .3); }
.btn-warning { --btn-bg: var(--grad-warning); --btn-shadow: rgba(249, 115, 22, .3); }
.btn-danger  { --btn-bg: var(--grad-danger);  --btn-shadow: rgba(225, 29, 72, .3); }
.btn-gold    { --btn-bg: var(--grad-gold);    --btn-shadow: rgba(245, 158, 11, .35); color: #451a03; }
.btn-grey    { --btn-bg: var(--grad-grey);    --btn-shadow: rgba(100, 116, 139, .25); color: #334155; }
/* Ghost buttons adapt their color to the surface they sit on:
   default (light glass panel) -> ocean-colored text + ocean-colored outline;
   dark containers (header / bottom action bar) -> white text + white outline.
   No button variant should assume it will only ever appear on one kind of background. */
.btn-ghost {
  --btn-bg: rgba(255, 255, 255, .55);
  background: rgba(255, 255, 255, .55);
  border: 1px solid rgba(14, 165, 233, .45);
  color: var(--ocean-700);
  box-shadow: none;
}
.btn-ghost:hover:not(:disabled) { background: rgba(224, 242, 254, .9); filter: none; }
.header .btn-ghost, .control-panel .btn-ghost {
  background: rgba(255, 255, 255, .14);
  border: 1px solid rgba(255, 255, 255, .32);
  color: #fff;
}
.header .btn-ghost:hover:not(:disabled), .control-panel .btn-ghost:hover:not(:disabled) {
  background: rgba(255, 255, 255, .26);
}
.btn-lg { padding: 12px 26px; font-size: 14px; border-radius: 14px; }
.btn-xl { padding: 15px 34px; font-size: 16px; border-radius: 16px; }
.btn-sub { display: block; font-size: 10px; font-weight: 500; opacity: .85; margin-top: 2px; }
.btn-shield {
  background: linear-gradient(135deg, #0f766e, #0ea5e9);
  color: #fff;
}

/* ---- Cards ---- */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px;
  padding: 4px 0;
}
.card {
  background: var(--glass-strong);
  border: 1px solid rgba(14, 165, 233, .18);
  border-radius: var(--radius-md);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: var(--shadow-soft);
  transition: transform .2s ease, box-shadow .2s ease;
}
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow-float); }
.golden-order-card {
  position: relative;
  border: 1px solid rgba(245, 158, 11, .75);
  background:
    radial-gradient(circle at 12% 0%, rgba(253, 230, 138, .38), transparent 34%),
    linear-gradient(135deg, rgba(255, 251, 235, .96), rgba(254, 243, 199, .94) 48%, rgba(255, 255, 255, .92));
  box-shadow: 0 18px 48px rgba(146, 64, 14, .18);
}
.golden-order-card.final-mandate { grid-column: 1 / -1; }
.golden-order-card::before,
.golden-order-card::after {
  content: '';
  position: absolute;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: rgba(245, 158, 11, .78);
  box-shadow: 0 0 18px rgba(245, 158, 11, .9);
  animation: mandateSpark 2.8s ease-in-out infinite;
  pointer-events: none;
}
.golden-order-card::before { top: 12px; right: 18px; }
.golden-order-card::after { bottom: 14px; left: 20px; animation-delay: -1.4s; }
.golden-order-card .card-header {
  background: linear-gradient(135deg, #451a03, #b45309 52%, #f59e0b);
  color: #fff7ed;
  border-bottom-color: rgba(245, 158, 11, .55);
  font-family: Georgia, "Times New Roman", "Noto Serif SC", serif;
  letter-spacing: 0;
}
.golden-order-card .card-total {
  color: #78350f;
  border-top-color: rgba(180, 83, 9, .35);
}
.card-tag.golden {
  background: linear-gradient(135deg, #fde68a, #f59e0b);
  color: #451a03;
  box-shadow: 0 2px 8px rgba(245, 158, 11, .28);
}
@keyframes mandateSpark {
  0%, 100% { opacity: .28; transform: translateY(0) scale(.82); }
  50% { opacity: 1; transform: translateY(-8px) scale(1.16); }
}
.card-header {
  background: linear-gradient(135deg, rgba(56, 189, 248, .14), rgba(20, 184, 166, .12));
  padding: 10px 14px;
  border-bottom: 1px solid rgba(14, 165, 233, .15);
  font-weight: 800;
  font-size: 13.5px;
  color: var(--ocean-900);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.card-tag {
  font-size: 10px;
  font-weight: 800;
  border-radius: 999px;
  padding: 2px 9px;
  background: rgba(14, 165, 233, .14);
  color: var(--ocean-700);
  white-space: nowrap;
}
.card-tag.product { background: rgba(245, 158, 11, .16); color: #92400e; }
.card-body { padding: 12px 14px; flex: 1; }
.card-footer { padding: 10px 14px; border-top: 1px solid rgba(148, 163, 184, .18); }
.card-total {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed rgba(148, 163, 184, .35);
  font-size: 13px;
  font-weight: 800;
  color: var(--ocean-900);
  display: flex;
  justify-content: space-between;
}

.resource-row { display: flex; align-items: center; padding: 4px 0; font-size: 12.5px; }
.resource-row .icon { font-size: 16px; margin-right: 7px; }
.resource-row .name { font-weight: 700; min-width: 64px; }
.resource-row .qty { margin: 0 6px; color: var(--ink-soft); }
.resource-row .price { color: var(--ink-faint); margin-left: auto; font-size: 11.5px; }
.resource-row .inv-status { margin-left: 8px; font-size: 11px; font-weight: 700; }

/* ---- Titles ---- */
.hero-title {
  font-size: 30px;
  font-weight: 900;
  text-align: center;
  margin: 18px 0 8px;
  background: linear-gradient(120deg, #075985, #0ea5e9 50%, #0d9488);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.subtitle-text { font-size: 14px; color: var(--ink-soft); text-align: center; margin-bottom: 18px; }
.center-block { max-width: 960px; margin: 0 auto; padding: 10px 6px; }

/* ---- PortMasters 2 / previous-game hint ---- */
.pm-banner {
  background: linear-gradient(135deg, #fffbeb, #fef3c7);
  border: 1px solid rgba(245, 158, 11, .45);
  border-radius: var(--radius-md);
  padding: 13px 16px;
  font-size: 12.5px;
  line-height: 1.7;
  color: #78350f;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  margin: 14px 0;
  box-shadow: 0 4px 14px rgba(245, 158, 11, .12);
}
.pm-banner .pm-icon { font-size: 24px; line-height: 1.2; }
.pm-banner strong { color: #92400e; }
.pm-banner a { color: #b45309; font-weight: 800; text-decoration-thickness: 2px; }
.pm-banner .pm-close {
  margin-left: auto;
  background: none; border: none;
  color: #b45309; font-size: 16px;
  cursor: pointer; padding: 0 2px;
  flex: none;
}

/* ---- Generic sections ---- */
.section-box {
  background: var(--glass-strong);
  border: 1px solid rgba(14, 165, 233, .16);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  margin: 14px 0;
  box-shadow: var(--shadow-soft);
}
.section-box h3 { color: var(--ocean-900); font-size: 15px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.section-hint { font-size: 11.5px; color: var(--ink-faint); margin-bottom: 10px; line-height: 1.6; }
.environment-banner {
  background: linear-gradient(135deg, rgba(224, 242, 254, .82), rgba(204, 251, 241, .7));
  border: 1px solid rgba(14, 165, 233, .28);
  border-radius: var(--radius-md);
  padding: 13px 16px;
  margin: 0 0 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow-soft);
}
.environment-banner .env-icon { font-size: 32px; line-height: 1; }
.environment-banner .env-copy { flex: 1; min-width: 180px; }
.environment-banner .env-title { font-size: 14px; font-weight: 900; color: var(--ocean-900); }
.environment-banner .env-desc { font-size: 12px; color: var(--ink-soft); line-height: 1.55; margin-top: 2px; }
.environment-banner .env-tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

.separator { height: 1px; background: linear-gradient(90deg, transparent, rgba(14, 165, 233, .4), transparent); margin: 16px 0; border: none; }

.profit-positive { color: #059669; font-weight: 800; }
.profit-negative { color: #e11d48; font-weight: 800; }

/* ---- Fortune cards ---- */
.boon-card {
  background: var(--glass-strong);
  border: 1px solid rgba(14, 165, 233, .2);
  border-radius: var(--radius-md);
  padding: 18px 14px;
  text-align: center;
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  box-shadow: var(--shadow-soft);
}
.boon-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-float); border-color: rgba(245, 158, 11, .5); }
.boon-icon { font-size: 44px; margin: 6px 0; filter: drop-shadow(0 4px 8px rgba(2,132,199,.2)); }
.boon-name { font-size: 15px; font-weight: 800; color: var(--ocean-900); margin: 6px 0; }
.boon-desc { font-size: 12px; color: var(--ink-soft); margin: 8px 0 12px; min-height: 48px; line-height: 1.6; }

/* ---- Artisans ---- */
.worker-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(255,255,255,.85);
  padding: 8px 12px;
  margin: 5px 0;
  border-radius: var(--radius-sm);
  border: 1px solid rgba(148, 163, 184, .25);
  font-size: 12px;
  gap: 8px;
}
.worker-row .w-state { color: var(--ink-soft); }
.worker-row .w-state .busy { color: #b45309; font-weight: 700; }
.worker-row .w-state .idle { color: #059669; font-weight: 700; }

/* ---- Broker's Whisper (collapsible panel) ---- */
.whisper-panel {
  background: linear-gradient(135deg, rgba(254, 243, 199, .6), rgba(255, 251, 235, .85));
  border: 1px solid rgba(245, 158, 11, .45);
  border-radius: var(--radius-md);
  margin: 0 0 16px;
  box-shadow: 0 4px 14px rgba(245, 158, 11, .12);
  overflow: hidden;
}
.whisper-panel summary {
  cursor: pointer;
  user-select: none;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 13px 16px;
  font-size: 14px;
  font-weight: 800;
  color: #92400e;
  transition: background .15s ease;
}
.whisper-panel summary:hover { background: rgba(245, 158, 11, .10); }
.whisper-panel summary::-webkit-details-marker { display: none; }
.whisper-panel summary::after {
  content: '▾';
  margin-left: auto;
  font-size: 14px;
  color: #b45309;
  transition: transform .2s ease;
}
.whisper-panel:not([open]) summary::after { transform: rotate(-90deg); }
.whisper-body { padding: 4px 16px 14px; }
.whisper-clue {
  background: rgba(255,255,255,.92);
  border: 1px solid rgba(245, 158, 11, .3);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  margin: 6px 0;
  font-size: 12.5px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ---- Barter ---- */
.trade-section {
  background: linear-gradient(135deg, rgba(254, 243, 199, .55), rgba(255, 251, 235, .8));
  border: 1px solid rgba(245, 158, 11, .35);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  margin: 14px 0;
}
.trade-section h3 { color: #92400e; font-size: 14px; margin-bottom: 4px; }
.trade-order {
  background: rgba(255,255,255,.92);
  border: 1px solid rgba(245, 158, 11, .3);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin: 8px 0;
  font-size: 12.5px;
  line-height: 1.7;
}
.trade-order .actions { margin-top: 8px; display: flex; gap: 8px; }
.trade-create { font-size: 12.5px; line-height: 2.1; }
.trade-create select, .trade-create input {
  padding: 6px 9px;
  margin: 2px 4px;
  border: 1px solid rgba(14, 165, 233, .35);
  border-radius: 9px;
  background: #fff;
  font-family: inherit;
  font-size: 12px;
}
.trade-create select:focus, .trade-create input:focus { outline: 2px solid rgba(14, 165, 233, .4); }

/* ---- Bottom action bar ---- */
.control-panel {
  grid-area: actions;
  background: var(--grad-deep);
  padding: 10px 16px;
  border-radius: var(--radius-lg);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  box-shadow: var(--shadow-float);
}
.sync-chip {
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.25);
  color: #fde68a;
  border-radius: 999px;
  padding: 6px 15px;
  font-size: 12px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.control-spacer { flex: 1; }
.control-hint { color: rgba(224, 242, 254, .8); font-size: 11.5px; }

/* ---- Log ---- */
.log-panel {
  grid-area: log;
  padding: 10px 14px;
  height: 132px;
  overflow-y: auto;
  font-size: 11.5px;
}
.log-panel .log-title {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1px;
  color: var(--ink-faint);
  margin-bottom: 4px;
  position: sticky;
  top: -4px;
  background: rgba(255,255,255,.85);
  backdrop-filter: blur(8px);
  padding: 3px 0;
}
.log-entry { padding: 3px 6px; border-bottom: 1px dotted rgba(148, 163, 184, .3); color: var(--ink-soft); }
.log-entry:last-child { border-bottom: none; }

/* ---- Dialogs ---- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(8, 47, 73, 0.5);
  backdrop-filter: blur(6px);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: var(--z-modal);
  padding: 20px;
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--glass-strong);
  backdrop-filter: blur(22px) saturate(1.4);
  border: 1px solid rgba(255,255,255,.7);
  border-radius: 24px;
  padding: 26px 28px;
  max-width: 620px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 24px 70px rgba(8, 47, 73, .35);
  animation: fadeUp .28s ease;
  position: relative;
}
.modal.modal-wide { max-width: 780px; }
.modal h2 { color: var(--ocean-900); margin-bottom: 14px; text-align: center; font-size: 20px; }
.modal .modal-x {
  position: absolute;
  top: 14px; right: 16px;
  background: rgba(148, 163, 184, .15);
  border: none;
  width: 30px; height: 30px;
  border-radius: 50%;
  font-size: 15px;
  color: var(--ink-soft);
  cursor: pointer;
  transition: background .15s ease;
}
.modal .modal-x:hover { background: rgba(148, 163, 184, .3); }

/* ---- Difficulty chooser (invite composer + invite confirmation) ---- */
.diff-options { display: flex; gap: 12px; margin: 16px 0 12px; }
.diff-option {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 14px 12px;
  border: 2px solid rgba(148, 163, 184, .35);
  border-radius: var(--radius-md);
  background: rgba(248, 250, 252, .8);
  cursor: pointer;
  font-family: inherit;
  transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
.diff-option:hover { transform: translateY(-2px); }
.diff-option.selected { border-color: var(--ocean-500, #0ea5e9); box-shadow: 0 6px 18px rgba(2,132,199,.18); background: #fff; }
.diff-badge { font-size: 16px; font-weight: 800; padding: 3px 14px; border-radius: 999px; color: #fff; }
.diff-badge.diff-easy { background: linear-gradient(135deg, #34d399, #0d9488); }
.diff-badge.diff-standard { background: linear-gradient(135deg, #fbbf24, #d97706); }
.diff-badge.diff-hard { background: linear-gradient(135deg, #fb7185, #b91c1c); }
.diff-tagline { font-size: 12px; color: var(--ink-soft); text-align: center; line-height: 1.5; }
.diff-summary {
  font-size: 13px; line-height: 1.85; color: #334155;
  background: rgba(224, 242, 254, .45);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  margin-bottom: 6px;
}
.chip.diff-easy { background: rgba(13, 148, 136, .16); color: #0f766e; }
.chip.diff-standard { background: rgba(217, 119, 6, .16); color: #b45309; }
.chip.diff-hard { background: rgba(185, 28, 28, .14); color: #b91c1c; }

/* ---- Manual ---- */
.manual-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; justify-content: center; }
.mtab {
  border: none;
  background: rgba(148, 163, 184, .18);
  color: var(--ink-soft);
  border-radius: 999px;
  padding: 7px 15px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all .15s ease;
}
.mtab:hover { background: rgba(56, 189, 248, .2); }
.mtab.active { background: var(--grad-primary); color: #fff; box-shadow: 0 3px 10px rgba(2,132,199,.3); }
.manual-body { font-size: 13px; color: #334155; line-height: 1.85; max-height: 50vh; overflow-y: auto; padding: 2px 8px 2px 2px; }
.manual-body h4 { color: var(--ocean-900); margin: 14px 0 6px; font-size: 14.5px; }
.manual-body h4:first-child { margin-top: 0; }
.manual-body ul, .manual-body ol { padding-left: 22px; margin: 4px 0 10px; }
.manual-body li { margin: 3px 0; }
.manual-body table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 8px 0 12px; background: #fff; border-radius: 8px; overflow: hidden; }
.manual-body th, .manual-body td { border: 1px solid rgba(148, 163, 184, .35); padding: 6px 9px; text-align: left; }
.manual-body th { background: rgba(224, 242, 254, .8); color: var(--ocean-900); }
.kbd { background: #0f172a; color: #fff; border-radius: 6px; padding: 1px 8px; font-size: 11px; font-weight: 700; }

/* ---- Login / Lobby ---- */
#login-overlay, #lobby-overlay {
  position: fixed; inset: 0;
  background:
    radial-gradient(900px 500px at 15% 10%, rgba(125, 211, 252, .4), transparent 65%),
    radial-gradient(800px 500px at 85% 90%, rgba(94, 234, 212, .4), transparent 65%),
    linear-gradient(180deg, #e0f2fe, #ccfbf1);
  display: flex; justify-content: center; align-items: center;
  z-index: var(--z-overlay);
  padding: 18px;
}
.login-box, .lobby-box {
  background: var(--glass-strong);
  backdrop-filter: blur(24px) saturate(1.4);
  border: 1px solid rgba(255,255,255,.75);
  border-radius: 26px;
  padding: 34px 32px;
  text-align: center;
  max-width: 460px;
  width: 100%;
  box-shadow: 0 24px 70px rgba(8, 47, 73, .22);
  animation: fadeUp .4s ease;
}
.login-brand .logo { font-size: 50px; filter: drop-shadow(0 6px 14px rgba(2,132,199,.3)); }
.login-brand h2 {
  font-size: 26px; font-weight: 900; margin: 8px 0 2px;
  background: linear-gradient(120deg, #075985, #0ea5e9 50%, #0d9488);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.login-brand .tagline { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 16px; }
.login-box input {
  width: 100%;
  padding: 12px 15px;
  margin: 7px 0;
  border: 1px solid rgba(14, 165, 233, .35);
  border-radius: 13px;
  font-size: 14px;
  font-family: inherit;
  background: rgba(255,255,255,.9);
  transition: border-color .15s ease, box-shadow .15s ease;
}
.login-box input:focus { outline: none; border-color: var(--ocean-500); box-shadow: 0 0 0 4px rgba(14, 165, 233, .15); }
.login-box .btn { width: 100%; margin: 6px 0; }
.pm-note {
  margin-top: 16px;
  font-size: 11.5px;
  color: #92400e;
  background: linear-gradient(135deg, #fffbeb, #fef3c7);
  border: 1px solid rgba(245, 158, 11, .4);
  border-radius: 13px;
  padding: 10px 13px;
  line-height: 1.7;
  text-align: left;
}
.pm-note a { color: #b45309; font-weight: 800; }

.lobby-box { max-width: 680px; max-height: 84vh; overflow-y: auto; text-align: left; }
.lobby-box h2 { text-align: center; color: var(--ocean-900); }
.lobby-sub { text-align: center; font-size: 12.5px; color: var(--ink-soft); margin: 6px 0 4px; line-height: 1.7; }
.online-user-item {
  background: rgba(255,255,255,.9);
  border: 1px solid rgba(14, 165, 233, .2);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  margin: 8px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: transform .15s ease, box-shadow .15s ease;
}
.online-user-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-soft); }
.online-user-item .u-name { font-weight: 700; color: var(--ocean-900); display: flex; align-items: center; gap: 8px; }

/* ---- Chat ---- */
#chat-window {
  position: fixed;
  bottom: 22px;
  right: 22px;
  width: 350px;
  height: 480px;
  background: var(--glass-strong);
  backdrop-filter: blur(20px) saturate(1.4);
  border: 1px solid rgba(255,255,255,.7);
  border-radius: 20px;
  display: none;
  flex-direction: column;
  z-index: var(--z-chat);
  box-shadow: 0 18px 50px rgba(8, 47, 73, .28);
  overflow: hidden;
}
#chat-header {
  background: var(--grad-deep);
  color: white;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  font-weight: 700;
}
#chat-messages { flex: 1; overflow-y: auto; padding: 12px; }
.chat-bubble {
  margin: 7px 0;
  padding: 8px 13px;
  border-radius: 15px;
  max-width: 80%;
  word-wrap: break-word;
  font-size: 12.5px;
  line-height: 1.55;
  animation: fadeUp .2s ease;
}
.chat-bubble.sent {
  background: var(--grad-primary);
  color: white;
  margin-left: auto;
  border-bottom-right-radius: 5px;
  box-shadow: 0 3px 8px rgba(2,132,199,.25);
}
.chat-bubble.received {
  background: rgba(255,255,255,.95);
  border: 1px solid rgba(148, 163, 184, .3);
  border-bottom-left-radius: 5px;
}
.chat-bubble-name { font-size: 10.5px; font-weight: 700; color: var(--ocean-600, #0284c7); margin-bottom: 2px; }
#chat-input-area { padding: 10px 12px; border-top: 1px solid rgba(148, 163, 184, .25); display: flex; gap: 8px; }
#chat-input {
  flex: 1;
  padding: 9px 13px;
  border: 1px solid rgba(14, 165, 233, .35);
  border-radius: 999px;
  font-family: inherit;
  font-size: 12.5px;
  background: rgba(255,255,255,.9);
}
#chat-input:focus { outline: none; border-color: var(--ocean-500); box-shadow: 0 0 0 3px rgba(14, 165, 233, .15); }

/* ---- Notifications / toast stack ---- */
/* All toasts live in a fixed top-right column so multiple can stack instead of overlapping. */
#toast-stack {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: var(--z-toast);
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
  pointer-events: none;
  max-width: 380px;
}
.notification {
  background: rgba(15, 23, 42, .92);
  backdrop-filter: blur(10px);
  color: #f0fdfa;
  padding: 13px 20px 13px 16px;
  border-radius: 14px;
  border-left: 4px solid #10b981;
  animation: slideIn .3s cubic-bezier(.2,.8,.3,1.1);
  box-shadow: 0 12px 32px rgba(0,0,0,.3);
  font-size: 13px;
  max-width: 360px;
  line-height: 1.55;
  pointer-events: auto;
}
.notification.error { border-left-color: #fb7185; }
.notification.log { border-left-color: #38bdf8; }
.notification.fading { animation: toastFadeOut .4s ease forwards; }
@keyframes slideIn {
  from { transform: translateX(420px); opacity: 0; }
  to   { transform: translateX(0); opacity: 1; }
}
@keyframes toastFadeOut {
  to { transform: translateX(420px); opacity: 0; }
}

/* ---- Spectator window (a separate floating window, doesn't take up the main stage) ---- */
.spectate-overlay {
  position: fixed;
  inset: 0;
  background: rgba(8, 47, 73, .45);
  backdrop-filter: blur(5px);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1500;             /* above the game UI, below dialogs like the manual */
  padding: 24px;
  animation: fadeIn .2s ease;
}
.spectate-window {
  width: min(940px, 100%);
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  background: var(--glass-strong);
  backdrop-filter: blur(22px) saturate(1.4);
  border: 1px solid rgba(255, 255, 255, .7);
  border-radius: 22px;
  box-shadow: 0 24px 70px rgba(8, 47, 73, .4);
  overflow: hidden;
  animation: fadeUp .28s ease;
}
.spectate-head {
  background: var(--grad-deep);
  color: #fff;
  padding: 13px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex: none;
}
.spectate-head .sp-title { flex: 1; font-weight: 800; font-size: 15px; min-width: 0; }
.spectate-head .sp-sub { font-size: 11px; font-weight: 500; color: rgba(224, 242, 254, .85); margin-top: 2px; }
.sp-live {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(244, 63, 94, .22);
  border: 1px solid rgba(244, 63, 94, .55);
  color: #fecdd3;
  border-radius: 999px;
  padding: 3px 11px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1px;
  flex: none;
}
.sp-live-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #fb7185;
  animation: livePulse 1.6s ease-in-out infinite;
}
@keyframes livePulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(251, 113, 133, .55); }
  50%      { box-shadow: 0 0 0 5px rgba(251, 113, 133, 0); }
}
.spectate-head .sp-close {
  background: rgba(255,255,255,.15);
  border: none;
  width: 30px; height: 30px;
  border-radius: 50%;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  flex: none;
  transition: background .15s ease;
}
.spectate-head .sp-close:hover { background: rgba(255,255,255,.3); }
/* Names on the left (always visible, never scrolled out of view), the selected captain's
   full data on the right. Splitting navigation from content like this is what lets the
   detail side stay wide enough to render in 1-2 columns without the cramped, deeply
   scrolled single column a narrow sidebar forces. */
.spectate-body {
  padding: 14px 18px;
  display: flex;
  align-items: stretch;
  gap: 16px;
  min-height: 0;
}
.sp-names {
  flex: none;
  width: 168px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  overflow-y: auto;
  border-right: 1px solid rgba(148, 163, 184, .25);
  padding-right: 14px;
}
.sp-name-item {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 9px 10px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ocean-900);

function workerWageRate(key, g) {
  const base = WAGES[key];
  const hasWorkshop = (g.equippedModules || []).some(m => m.id === 'artisans_workshop');
  return hasWorkshop ? Math.floor(base * 1.2) : base; // matches server pay_wages()
}

function pendingWages(g) {
  return WORKER_TYPES.reduce((sum, wt) => sum + (g[wt.listKey] || []).length * workerWageRate(wt.key, g), 0);
}

function pendingMaintenance(g) {
  return g.fixedCost + (g.maintenancePenalty || 0); // matches server pay_maintenance()
}

/* Replace canonical names in a string one by one with English (fallback path) */
function lstNames(s) {
  const out = Object.keys(EN_NAMES).reduce((acc, k) => acc.split(k).join(EN_NAMES[k]), String(s));
  return out.split('、').join(', ');
}

/* localize server text: translates display text sent by the server when the UI is in English */
function lst(s) {
  if (LANG !== 'en' || !s) return s;
  for (const [re, fn] of SERVER_TEXT_RULES) {
    const m = String(s).match(re);
    if (m) return fn(m);
  }
  return lstNames(String(s));
}
/* Translate compound noun strings from server cards (e.g. "Hemp Cloth×2 + Silk×1") noun by noun */
const tnames = s => (LANG === 'en' ? lstNames(s) : s);

/* ============================================================
   Notifications / Login & Registration
   ============================================================ */
/* Append a toast into the stacking container so several can coexist; it lingers for `ttl`
   then fades out. Used for invites/errors (short) and per-action log bubbles (~10s).
   onClick, when given, makes the toast clickable (e.g. a chat message opens the chat
   window) and dismisses it immediately on click instead of waiting for the fade timeout. */
function pushToast(message, kind = '', ttl = 10000, onClick = null) {
  let stack = document.getElementById('toast-stack');
  if (!stack) { stack = document.createElement('div'); stack.id = 'toast-stack'; document.body.appendChild(stack); }
  const el = document.createElement('div');
  el.className = 'notification' + (kind ? ' ' + kind : '');
  el.textContent = message;
  if (onClick) {
    el.style.cursor = 'pointer';
    el.onclick = () => { onClick(); el.remove(); };
  }
  stack.appendChild(el);
  // Cap visible toasts so a burst of actions can't fill the screen; drop the oldest.
  while (stack.children.length > 6) stack.removeChild(stack.firstChild);
  setTimeout(() => {
    el.classList.add('fading');
    setTimeout(() => el.remove(), 400);
  }, ttl);
}

function showNotification(message, isError = false, onClick = null) {
  pushToast(message, isError ? 'error' : '', 3500, onClick);
}

/* A floating bubble for each new Captain's Log line, lingering ~10s, mirroring what the log
   panel records. logSeq (from the server) is a monotonic count of this game's log lines, so we
   only toast lines added since the last state, and never replay the backlog on login/resume. */
let lastLogSeq = null;
function maybeToastNewLogs() {
  const g = serverState && serverState.yourGame;
  if (!g) return;
  const seq = g.logSeq || 0;
  const logs = g.logs || [];
  if (lastLogSeq === null || seq < lastLogSeq) {
    lastLogSeq = seq;  // first state, or a restart reset the counter: sync without toasting
    return;
  }
  if (seq > lastLogSeq) {
    const newCount = Math.min(seq - lastLogSeq, logs.length);
    for (const m of logs.slice(logs.length - newCount)) pushToast(lst(m), 'log', 10000);
    lastLogSeq = seq;
  }
}

function showRegister() {
  document.getElementById('login-form').style.display = 'none';
  document.getElementById('register-form').style.display = 'block';
}

function showLogin() {
  document.getElementById('login-form').style.display = 'block';
  document.getElementById('register-form').style.display = 'none';
}

function register() {
  const username = document.getElementById('reg-username').value.trim();
  const password = document.getElementById('reg-password').value;
  const password2 = document.getElementById('reg-password2').value;

  if (password !== password2) {
    showNotification(tr('两次密码不一致', 'Passwords do not match'), true);
    return;
  }

  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`);
  ws.onopen = () => {
    ws.send(JSON.stringify({ action: "register", username, password }));
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'register_result') {
      if (msg.success) {
        showNotification(lst(msg.message));
        showLogin();
      } else {
        showNotification(lst(msg.message), true);
      }
      ws.close();
    }
  };
}

function login() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;

  if (!username || !password) {
    showNotification(tr('请输入用户名和密码', 'Please enter a username and password'), true);
    return;
  }

  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`);
  ws.onopen = () => {
    ws.send(JSON.stringify({ action: "login", username, password }));
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'login_result') {
      if (msg.success) {
        currentUser = msg.username;
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('lobby-overlay').style.display = 'flex';
        applyLanguage();   // the lobby welcome message includes the username, so it needs refilling after login
        setupWebSocketHandlers();
        ws.send(JSON.stringify({ action: "get_online_users" }));
      } else {
        showNotification(lst(msg.message), true);
        ws.close();
      }
    }
  };
}

function logout() {
  if (!confirm(tr('确定要退出登录吗？游戏进度已保存在服务器，重新登录可继续。',
                  'Log out? Your progress is saved on the server, so you can log back in to continue.'))) return;
  if (ws) ws.close();
  location.reload();
}

/* ============================================================
   WebSocket message handling (kept in sync with the server protocol)
   ============================================================ */
function setupWebSocketHandlers() {
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);

    if (msg.type === 'online_users' || msg.type === 'online_users_update') {
      onlineUsers = msg.users;
      renderOnlineUsers();
    }

    else if (msg.type === 'invite_received') {
      showInviteModal(msg.from, msg.difficulty);
    }

    else if (msg.type === 'invite_cancelled') {
      if (pendingInviteFrom === msg.from) {
        pendingInviteFrom = null;
        closeModal();
        showNotification(tr(`${msg.from} 的邀请已失效`, `${msg.from}'s invitation has expired`), true);
      }
    }

    else if (msg.type === 'invite_accepted') {
      delete inviteStatus[msg.partner];
      pendingRoom = null;
      enterGameView();
      ws.send(JSON.stringify({ action: "join_game" }));
      showNotification(tr(`已加入游戏，伙伴: ${msg.partner}`, `Joined the game, partner: ${msg.partner}`));
      maybeShowOnboarding();
    }

    else if (msg.type === 'session_resumed') {
      enterGameView();
      showNotification(tr('已恢复游戏会话', 'Session resumed'));
      maybeShowOnboarding();
    }

    else if (msg.type === 'partner_status') {
      showNotification(msg.online ? tr(`${msg.username} 已重新上线`, `${msg.username} is back online`)
                                  : tr(`${msg.username} 已离线`, `${msg.username} went offline`), !msg.online);
    }

    else if (msg.type === 'open_rooms_update') {
      openRooms = msg.rooms;
      renderOpenRooms();
    }

    else if (msg.type === 'room_roster') {
      pendingRoom = msg;
      renderRoomLobby();
    }

    else if (msg.type === 'room_started') {
      pendingRoom = null;
      enterGameView();
      ws.send(JSON.stringify({ action: "join_game" }));
      showNotification(tr('航程开始！', 'The voyage has begun!'));
      maybeShowOnboarding();
    }

    else if (msg.type === 'session_ended') {
      enterLobbyView();
      showNotification(tr('全员已同意结束会话，已返回大厅', 'Everyone agreed to end the session. Back in the lobby.'));
    }

    else if (msg.type === 'invite_rejected') {
      showNotification(tr(`${msg.from} 拒绝了你的邀请`, `${msg.from} declined your invitation`), true);
      delete inviteStatus[msg.from];
      renderOnlineUsers();
    }

    else if (msg.type === 'invite_timeout') {
      showNotification(tr(`发送给 ${msg.to} 的邀请已超时`, `Your invitation to ${msg.to} timed out`), true);
      delete inviteStatus[msg.to];
      renderOnlineUsers();
    }

    else if (msg.type === 'invite_result') {
      if (msg.success) {
        showNotification(lst(msg.message));
      } else {
        showNotification(lst(msg.message), true);
        if (lastInviteTo) {
          delete inviteStatus[lastInviteTo];
          lastInviteTo = null;
          renderOnlineUsers();
        }
      }
    }

    else if (msg.type === 'chat_message') {
      appendChatMessage(msg.from, msg.message, false);
      if (document.getElementById('chat-window').style.display !== 'flex') {
        showNotification(`💬 ${msg.from}: ${msg.message}`, false, () => setChatOpen(true));
      }
    }

    else if (msg.type === 'chat_history') {
      const messagesDiv = document.getElementById('chat-messages');
      messagesDiv.innerHTML = '';
      msg.history.forEach(m => {
        appendChatMessage(m.from, m.message, m.from === currentUser);
      });
    }

    else if (msg.type === 'state') {
      const prevEndVotes = (serverState && serverState.endSessionVotes) || 0;
      serverState = msg.data;
      if (serverState.yourGame) serverState.yourGame.slot = serverState.yourSlot;
      pendingRoom = null;
      updateChatSendState();
      maybeToastNewLogs();
      if (serverState.endSessionVotes > prevEndVotes && !serverState.youVotedEnd) {
        showNotification(tr(`🚪 已有 ${serverState.endSessionVotes}/${serverState.endSessionTotal} 人同意结束会话并返回大厅`,
          `🚪 ${serverState.endSessionVotes}/${serverState.endSessionTotal} have agreed to end the session and return to the lobby`));
      }
      renderAll();
    }

    else if (msg.type === 'system_message') {
      showNotification(lst(msg.message));
    }
  };

  ws.onclose = () => {
    if (currentUser) {
      showNotification(tr('连接断开，请刷新页面', 'Connection lost. Please refresh the page'), true);
    }
  };
}

/* ============================================================
   Chat
   ============================================================ */
/* Whether anyone else in the current room/session is online (chat has someone to reach). */
function othersOnline() {
  return ((serverState && serverState.players) || []).some(p => p.name !== currentUser && p.online);
}

function updateChatSendState() {
  const btn = document.getElementById('chat-send-btn');
  const input = document.getElementById('chat-input');
  const enabled = othersOnline();
  btn.disabled = !enabled;
  input.disabled = !enabled;
  input.placeholder = enabled ? tr('输入消息...', 'Type a message...') : tr('其他玩家均离线，无法发送', 'Everyone else is offline, cannot send');
}

/* Opens or closes the chat window outright (idempotent), as opposed to toggleChat() which
   flips it. Clicking a chat notification should always open the window, never close it. */
function setChatOpen(open) {
  const chatWindow = document.getElementById('chat-window');
  if (open) {
    chatWindow.style.display = 'flex';
    updateChatSendState();
    ws.send(JSON.stringify({ action: "get_chat_history" }));
  } else {
    chatWindow.style.display = 'none';
  }
}

function toggleChat() {
  setChatOpen(document.getElementById('chat-window').style.display !== 'flex');
}

function sendChat() {
  const input = document.getElementById('chat-input');
  const message = input.value.trim();
  if (!message || !othersOnline()) return;

  ws.send(JSON.stringify({ action: "send_chat", message }));
  appendChatMessage(currentUser, message, true);
  input.value = '';
}

/* Room chat is shared by everyone present, so received bubbles are labeled with the
   sender's name; a message you sent yourself doesn't need a "Me:" label. */
function appendChatMessage(from, message, isSent) {
  const messagesDiv = document.getElementById('chat-messages');
  const bubble = document.createElement('div');
  bubble.className = 'chat-bubble ' + (isSent ? 'sent' : 'received');
  if (!isSent) {
    const nameEl = document.createElement('div');
    nameEl.className = 'chat-bubble-name';
    nameEl.textContent = from;
    bubble.appendChild(nameEl);
  }
  const textEl = document.createElement('div');
  textEl.textContent = message;
  bubble.appendChild(textEl);
  messagesDiv.appendChild(bubble);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

/* ============================================================
   Render entry point
   Re-render on demand: only rebuild the DOM for a panel when its underlying data
   has actually changed. Wholesale innerHTML rebuilds reset scroll position and
   break in-progress clicks (a click never fires if mousedown and mouseup land on
   different DOM nodes), which was the root cause of the earlier "buttons don't
   respond / page jumps back to top" bugs, so blanket re-renders are forbidden.
   ============================================================ */
let _lastMyJson = '';
let _lastRosterJson = '';

function renderAll(force = false) {
  if (!serverState) return;
  const myJson = JSON.stringify([
    serverState.yourGame, serverState.tradeOrders, serverState.tradeReady,
    serverState.phaseReadyCount, serverState.phaseTotalCount, serverState.waitingForOther, serverState.youReady,
    serverState.endSessionVotes, serverState.endSessionTotal, serverState.youVotedEnd
  ]);
  const rosterJson = JSON.stringify([serverState.otherGames, serverState.players]);
  const myChanged = force || myJson !== _lastMyJson;
  const rosterChanged = force || rosterJson !== _lastRosterJson;
  _lastMyJson = myJson;
  _lastRosterJson = rosterJson;

  if (myChanged) {
    renderStatus();
    renderControls();
    renderLog();
    renderEndSessionButton();
  }
  if (rosterChanged) renderRoster();
  if (myChanged) renderPhase();
  /* The captain viewer shows another room member's data and refreshes live with it,
     regardless of whether you're bankrupt; it only closes when the player closes it. */
  if (_viewerOpen && rosterChanged) renderCaptainViewer();
}

/* ---------- Shared: fleet status card (you and your partner use the same component, for easy comparison) ---------- */
function buffChipsHTML(g) {
  const flags = g.modifierFlags || {};
  const chips = Object.keys(flags)
    .map(k => {
      /* product_order_bonus is shared by two Fortunes; the payload contains products/pct and is rendered directly from that */
      if (k === 'product_order_bonus') {
        const v = flags[k];
        if (!v || !v.products || !v.products.length) return null;
        const names = v.products.map(tn).join(tr('、', ', '));
        const pct = Math.round((v.pct || 0) * 100);
        const icon = ICONS[v.products[0]] || '💎';
        return `<span class="chip tip" data-tip="${tr(`${names}订单报酬提高${pct}%`, `${names} orders pay +${pct}% this round`)}">${icon} ${names} +${pct}%</span>`;
      }
      const f = FLAG_LABELS[k];
      if (!f) return null;
      const t = BOON_TEXT[f.id] || {};
      return `<span class="chip tip" data-tip="${pf(t.desc)}">${f.icon} ${pf(t.name)}</span>`;
    })
    .filter(Boolean);
  return chips.length ? chips.join('') : `<span class="muted">${tr('本回合暂无增益', 'No buffs this round')}</span>`;
}

function environmentBannerHTML(g) {
  const m = g && g.monsoon_state;
  if (!m) return '';
  const ports = (m.rewardPorts || []).map(tn).join(tr('、', ', '));
  const resource = m.resource ? tn(m.resource) : '';
  const rewardPct = Math.round(((m.rewardMultiplier || 1) - 1) * 100);
  const pricePct = Math.round(Math.abs(((m.purchaseMultiplier || 1) - 1) * 100));
  const riskPct = Math.round((g.pirateRiskEffective ?? m.pirateRisk ?? 0) * 100);
  const priceWord = (m.purchaseMultiplier || 1) < 1 ? tr('降价', 'cheaper') : tr('涨价', 'pricier');
  return `
    <div class="environment-banner">
      <div class="env-icon">${m.icon || '🌦️'}</div>
      <div class="env-copy">
        <div class="env-title">${tr('全球环境：', 'Global Environment: ')}${escapeHtml(monsoonName(m))}</div>
        <div class="env-desc">${escapeHtml(monsoonDesc(m))}</div>
      </div>
      <div class="env-tags">
        <span class="chip green">${tr(`${ports} 订单 +${rewardPct}%`, `${ports} orders +${rewardPct}%`)}</span>
        <span class="chip amber">${tr(`${resource} ${priceWord} ${pricePct}%`, `${resource} ${priceWord} ${pricePct}%`)}</span>
        <span class="chip ${g.pirate_immunity ? 'green' : 'amber'}">${g.pirate_immunity ? tr('🛡️ 已护航', '🛡️ Escorted') : tr(`🏴‍☠️ 海盗 ${riskPct}%`, `🏴‍☠️ Pirates ${riskPct}%`)}</span>

}

function crewSectionsHTML(g) {
  return crewSections(g).join('');
}

/* ---------- My panel ---------- */
function renderStatus() {
  const g = serverState.yourGame;
  if (!g) return;
  const p = document.getElementById('status-panel');

  let html = `
    <div class="crew-head">
      <div class="avatar">🧑‍✈️</div>
      <div class="who">
        <div class="nm">${escapeHtml(currentUser || tr('我', 'Me'))}</div>

      </div>

      <div class="stat-row"><span class="tip" data-tip="${tr('每回合结算阶段必须支付的固定运营成本，付不起即破产', 'Fixed operating cost paid every Upkeep phase. Fail to pay and you go bankrupt')}">${tr('🔧 维护费', '🔧 Upkeep')}</span><span class="stat-value">${pendMaint} ${tr('金币', 'gold')}</span></div>
      <div class="stat-row"><span class="tip" data-tip="${tr('结算阶段自动支付的全部工匠工资，付不起即破产', 'All artisan wages, paid automatically at Upkeep. Fail to pay and you go bankrupt')}">${tr('👥 工资合计', '👥 Total wages')}</span><span class="stat-value">${pendWages} ${tr('金币', 'gold')}</span></div>
      <div class="stat-row" style="border-top:1px solid rgba(148,163,184,.3);margin-top:4px;padding-top:5px">

/* ---------- Roster: every other player in the room, each a collapsed widget ---------- */
/* Collapsed widgets only ever show gold/renown/bankruptcy at a glance; clicking one opens
   the captain detail viewer (see below) rather than expanding in place. Stacking several
   full fleet breakdowns inside this ~300px sidebar is exactly what made the old "tap to
   expand inline" design unusable once a room had more than one other player: the column
   isn't wide enough to show one player's data comfortably, let alone several stacked on
   top of each other, so the viewer gets its own properly sized window instead. */
function rosterWidgetHTML(p) {
  const og = serverState.otherGames && serverState.otherGames[p.name];
  if (!og) {
    return `
      <div class="roster-widget">
        <div class="roster-widget-head">
          <span class="dot off"></span>
          <span class="nm">${escapeHtml(p.name)}</span>
          <span class="muted" style="margin-left:auto;font-size:11px">${tr('尚未加入对局', 'Not in this game yet')}</span>
        </div>
      </div>`;
  }
  const statusChip = og.bankrupt ? `<span class="chip" style="background:var(--grad-danger);color:#fff">${tr('💥 破产', '💥 Bankrupt')}</span>`
    : (og.gameOver ? `<span class="chip amber">${tr('已结束', 'Finished')}</span>` : '');
  return `
    <div class="roster-widget">
      <div class="roster-widget-head" data-roster-view="${escapeHtml(p.name)}" title="${tr('查看完整信息', 'View full info')}">
        <span class="dot ${p.online ? 'on' : 'off'}" title="${p.online ? tr('在线', 'Online') : tr('离线', 'Offline')}"></span>
        <span class="nm">${escapeHtml(p.name)}${p.isHost ? ' 👑' : ''}</span>
        <span class="roster-widget-stats">
          <span class="stat-money">💰 ${og.money}</span>
          <span class="stat-score">🏆 ${og.score}</span>
          ${statusChip}
        </span>
        <span class="roster-toggle">🔍</span>
      </div>
    </div>
  `;
}

function renderRoster() {
  const p = document.getElementById('roster-panel');
  if (!p) return;
  const players = (serverState && serverState.players) || [];
  const others = players.filter(pl => pl.name !== currentUser);

  if (!others.length) {
    p.innerHTML = `
      <div class="crew-head partner">
        <div class="avatar">🧑‍✈️</div>
        <div class="who"><div class="nm">${tr('等待同行...', 'Waiting for others...')}</div><div class="role">${tr('同行船队', 'Fellow Captains')}</div></div>
        <span class="dot off"></span>
      </div>
      <p class="muted" style="padding:8px 2px;line-height:1.8">${tr(
        '进入共享会话后，这里会列出同行的每位船长，点击即可在独立窗口中查看声望、存款、货物、工匠与增益，方便协商互市。',

      <div class="who"><div class="nm">${tr('同行船队', 'Fellow Captains')}</div><div class="role">${tr(`共 ${others.length} 位船长`, `${others.length} other captain(s)`)}</div></div>
    </div>
    ${others.map(rosterWidgetHTML).join('')}
    <div class="status-section" style="background:linear-gradient(135deg,rgba(56,189,248,.08),rgba(20,184,166,.08))">
      <span class="muted">${tr('💡 看准同行缺什么、富余什么，在<strong>互市阶段</strong>发起互利交易，或随时点右上角 💬 沟通。',

/* ---------- Phase stage ---------- */
function stepperHTML(currentKey) {
  const curIdx = (currentKey === 'endgame' || currentKey === 'bankruptcy')
    ? PHASE_FLOW.length
    : (PHASE_INDEX[currentKey] !== undefined ? PHASE_INDEX[currentKey] : -1);
  return `
    <div class="stepper" title="${tr('本回合流程：全员同步经过这8个阶段', 'Round flow: everyone moves through these 8 phases in sync')}">
      ${PHASE_FLOW.map((s, i) => {
        const cls = i < curIdx ? 'done' : (i === curIdx ? 'current' : '');
        const inner = i < curIdx ? '✓' : s.icon;
        return `
          <div class="step ${cls}">
            <div class="bubble">${inner}</div>
            <div class="lbl">${pf(s.name)}</div>
          </div>`;
      }).join('')}
    </div>`;
}

/* Always-visible reminder of the agreed difficulty. Hovering it brings up the same
   plain-language summary both captains saw when they agreed to the voyage. */
function difficultyChipHTML(g) {
  const info = difficultyInfo(g && g.difficulty);
  return `<span class="chip tip diff-${info.key}" data-tip="${escapeHtml(info.summary())}">${tr('难度', 'Difficulty')}：${info.badge()}</span>`;
}

function phaseBriefHTML(key, extraChips = '') {
  const meta = PHASE_FLOW[PHASE_INDEX[key]];
  if (!meta) return '';
  const readyCount = serverState.phaseReadyCount || 0;
  const totalCount = serverState.phaseTotalCount || 2;
  const waiting = serverState.waitingForOther;
  return `
    <div class="phase-brief">
      <div class="pb-icon">${meta.icon}</div>
      <div class="pb-text">
        <h2>${tr(`${pf(meta.name)}阶段 · 第 ${serverState.yourGame.currentRound} 程`,
                 `${pf(meta.name)} Phase · Round ${serverState.yourGame.currentRound}`)}</h2>
        <p>${pf(meta.brief)}</p>
      </div>
      <div class="pb-sync">
        ${difficultyChipHTML(serverState.yourGame)}
        <span class="chip ${readyCount >= totalCount ? 'green' : ''}" title="${tr('全员确认后才进入下一阶段', 'The next phase starts once everyone confirms')}">${tr(`🔄 全员就绪 ${readyCount} / ${totalCount}`, `🔄 Ready ${readyCount} / ${totalCount}`)}</span>
        ${waiting ? `<span class="chip amber">⏳ ${escapeHtml(lst(waiting))}</span>` : ''}
        ${extraChips}
      </div>
    </div>`;
}

function pm1HintHTML(context) {
  return `
    <div class="pm-banner">
      <span class="pm-icon">🧭</span>
      <span>
        ${context}
        ${tr(`本作 <strong>PortMasters 2</strong> 上手门槛较高；可以先游玩上一代
        <a href="${pm1Url()}" target="_blank" rel="noopener">${pm1Label()}</a>
        熟悉采购、生产与贸易的基本节奏，再回来挑战。`,
        `<strong>PortMasters 2</strong> has a steep learning curve, so consider warming up with
        <a href="${pm1Url()}" target="_blank" rel="noopener">${pm1Label()}</a>
        to learn the buy → produce → trade loop, then come back for the challenge.`)}
      </span>
    </div>`;
}

function renderPhase() {
  const p = document.getElementById('phase-panel');
  const g = serverState.yourGame;
  if (!g) return;
  /* Defensive: a bankrupt player always stays on the bankruptcy page, even if the server sends a different phase value */
  const phase = g.bankrupt ? 'bankruptcy' : g.phase;
  let inner = '';
  switch (phase) {
    case 0: inner = welcomeHTML(); break;
    case 5: inner = boonDraftHTML(); break;
    case 1: inner = purchaseHTML(); break;
    case 'trade': inner = tradePhaseHTML(); break;
    case 'worker_mgmt': inner = workerMgmtHTML(); break;
    case 2: inner = ordersHTML(); break;
    case 3: inner = maintenanceHTML(); break;
    case 4: inner = shipyardHTML(); break;
    case 'bankruptcy': inner = bankruptcyHTML(); break;
    case 'endgame': inner = endgameHTML(); break;
    default: inner = `<div class="center-block"><div class="hero-title">${tr('⚓ 准备中...', '⚓ Preparing...')}</div></div>`;
  }

  /* The barter form preserves what the user has typed across re-renders (user freedom and control) */
  const formState = captureTradeForm();
  const scrollPos = p.scrollTop;
  p.innerHTML = `<div class="phase-view">${stepperHTML(phase)}${inner}</div>`;
  restoreTradeForm(formState);
  p.scrollTop = scrollPos;   // preserve scroll position after re-render so the page doesn't jump back to the top
}

/* ---------- Per-phase views ---------- */

}

          ${tr(`<strong>欢迎来到 PortMasters 2！</strong>本作引入增值税、所得税、工匠工资、双人同步互市等深度机制，<strong>上手门槛高于一代</strong>。

        <div class="section-hint">
          ${PHASE_FLOW.map(s => `${s.icon} <strong>${pf(s.name)}</strong>`).join(' → ')}

    ${phaseBriefHTML(0)}

  localStorage.setItem('pm2_banner_dismissed', '1');

}

  const locked = !!serverState.youReady;
  return `
    ${phaseBriefHTML(5, `<span class="chip">${tr('🧭 罗盘随机：每人各自抽到不同的4张', "🧭 Compass draw: everyone gets a different 4")}</span>`)}

      <div class="card-grid">
        ${pool.map(b => `
          <div class="boon-card">
            <div class="boon-icon">${b.icon}</div>

            <div class="boon-desc">${escapeHtml(boonDesc(b))}</div>
            <button class="btn ${locked ? 'btn-grey' : 'btn-gold'} btn-lg" ${locked ? 'disabled' : ''}
              onclick="sendAction('selectBoon', {boonId: '${b.id}'})" title="${locked ? tr('本回合福缘已锁定', 'Your fortune is locked for this round') : tr('锁定后本回合不可更换', 'Once locked, it cannot be changed this round')}">

            </button>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function purchaseHTML() {
  const g = serverState.yourGame;
  const cards = g.resourceCards || [];
  const flags = g.modifierFlags || {};

/* Barter form state is preserved across re-renders */
function captureTradeForm() {
  const ids = ['sell-type', 'sell-qty', 'buy-type', 'buy-qty'];
  const state = {};
  let any = false;
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (el) { state[id] = el.value; any = true; }
  });
  return any ? state : null;
}
function restoreTradeForm(state) {
  if (!state) return;
  Object.keys(state).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = state[id];
  });
}

function createTradeOrder() {
  const sellType = document.getElementById('sell-type').value;
  const sellQty = parseInt(document.getElementById('sell-qty').value);
  const buyType = document.getElementById('buy-type').value;
  const buyQty = parseInt(document.getElementById('buy-qty').value);
  if (isNaN(sellQty) || sellQty < 1 || isNaN(buyQty) || buyQty < 1) {
    showNotification(tr('数量必须为大于 0 的整数', 'Quantities must be whole numbers greater than 0'), true);
    return;
  }
  if (sellType === buyType) {
    showNotification(tr('出售与换取不能是同一种物品', "You can't trade an item for itself"), true);
    return;
  }
  sendAction('createTradeOrder', {
    sell: [{ type: sellType, quantity: sellQty }],
    buy: [{ type: buyType, quantity: buyQty }]
  });
  showNotification(tr('📨 订单已发布，房间内其他人可接受或拒绝', '📨 Offer posted. Anyone else in the room can accept or decline it'));
}

          const mats = RECIPE_MATS[t].map(([m, a]) => `${ICONS[m]}${tn(m)}×${a}`).join(' + ');
          const can = RECIPE_MATS[t].every(([m, a]) => (serverState.yourGame.inventory[m] || 0) >= a);
          return `<button class="btn ${can ? '' : 'btn-grey'}" style="margin:3px 3px 0 0; padding:7px 13px; font-size:11.5px"
            onclick="sendAction('assignTask', {workerType: '${type}', task: '${t}'})"

}

function fireWorkerConfirm(type, index) {
  if (!confirm(tr(`确定解雇这名${wName(type)}吗？需支付 ${WAGES[type]} 金币遣散费，且无法撤销。`,
                  `Dismiss this ${wName(type)}? It costs ${WAGES[type]} gold severance and cannot be undone.`))) return;
  sendAction('fireWorker', { workerType: type, index });
}

function estimateTransport(g, totalItems) {
  return Math.max(5, totalItems * 2 - g.shipLevel * 5);
}

/* ============================================================
   Captain detail viewer
   The single place that shows another room member's full fleet data, used both for
   browsing a fellow captain's stats mid-game (from a roster widget) and for spectating
   someone still playing while you're bankrupt. It's a separate floating window rather
   than the sidebar, with captain names always listed on the left and the selected
   captain's data laid out across two columns on the right, sized to read without the
   heavy scrolling a 300px sidebar would force. Built on crewSections(), the same
   section renderer the self panel uses, so this view can never drift out of sync with
   what "your own panel" shows.
   ============================================================ */
let _viewerOpen = false;
let viewerTarget = null; // username of the other room member currently being viewed

function openCaptainViewer(target) {
  const others = Object.keys((serverState && serverState.otherGames) || {});
  viewerTarget = (target && others.includes(target)) ? target : others[0];
  if (!viewerTarget) return;
  _viewerOpen = true;
  renderCaptainViewer();
}

function closeCaptainViewer() {
  _viewerOpen = false;
  viewerTarget = null;
  document.getElementById('captain-viewer-root').innerHTML = '';
}

function renderCaptainViewer() {
  if (!_viewerOpen) return;
  const others = (serverState && serverState.otherGames) || {};
  if (!others[viewerTarget]) viewerTarget = Object.keys(others)[0];
  const og = others[viewerTarget];
  if (!og) { closeCaptainViewer(); return; }
  const players = (serverState && serverState.players) || [];
  const name = escapeHtml(viewerTarget || tr('伙伴', 'Partner'));
  const targetOnline = players.some(p => p.name === viewerTarget && p.online);
  const recentLogs = (og.logs || []).slice(-8).reverse();
  const [overview, buffs, environment, flagship, cargo, workers] = crewSections(og);

  const nameListHTML = Object.keys(others).map(n => {
    const p = players.find(pl => pl.name === n);
    return `
      <div class="sp-name-item${n === viewerTarget ? ' active' : ''}" data-viewer-name="${escapeHtml(n)}">
        <span class="dot ${p && p.online ? 'on' : 'off'}"></span>
        <span class="nm">${escapeHtml(n)}${p && p.isHost ? ' 👑' : ''}</span>
      </div>`;
  }).join('');

  document.getElementById('captain-viewer-root').innerHTML = `
    <div class="spectate-overlay" onclick="if(event.target===this)closeCaptainViewer()">
      <div class="spectate-window">
        <div class="spectate-head">
          <span class="sp-live"><span class="sp-live-dot"></span>LIVE</span>
          <div class="sp-title">
            ${tr(`👀 ${name} 的商队`, `👀 ${name}'s Fleet`)}
            <div class="sp-sub">${tr(`第 ${og.currentRound} / ${og.maxRounds} 程 · ${phaseName(og.phase)}阶段 · 只读视角，随其操作实时更新`,
              `Round ${og.currentRound} / ${og.maxRounds} · ${phaseName(og.phase)} phase · read-only, updates live`)}</div>
          </div>
          ${targetOnline ? '' : `<span class="chip amber">${tr('对方离线', 'Offline')}</span>`}
          <button class="sp-close" onclick="closeCaptainViewer()" title="${tr('关闭窗口（Esc）', 'Close window (Esc)')}">×</button>
        </div>
        <div class="spectate-body">
          <div class="sp-names">${nameListHTML}</div>
          <div class="sp-detail">
            <div class="sp-col">${overview}${buffs}${environment}</div>
            <div class="sp-col">${flagship}${cargo}${workers}</div>
            <div class="status-section sp-wide">
              <h3>${tr('📜 近期动态（最新在前）', '📜 Recent Activity (newest first)')}</h3>
              ${recentLogs.length
                ? recentLogs.map(m => `<div class="stat-row" style="font-size:11.5px;color:var(--ink-soft)">${escapeHtml(lst(m))}</div>`).join('')
                : `<span class="muted">${tr('暂无动态', 'Nothing yet')}</span>`}
            </div>
          </div>
        </div>
        <div class="spectate-foot">
          ${tr('💡 此窗口可随时关闭再打开；等待全员结束本局后即可一同重新起航。', '💡 Open or close this window any time. Once everyone else finishes their game, you can set sail together again.')}
        </div>
      </div>
    </div>`;
  document.querySelectorAll('[data-viewer-name]').forEach(el => {
    el.onclick = () => openCaptainViewer(el.dataset.viewerName);
  });
}

  const stillPlaying = Object.entries(others).filter(([, og]) => !og.gameOver).map(([n]) => n);

  return `

function confirmRestart() {
  if (!confirm(tr('重新起航将把全员的进度都重置为第1程，确定继续吗？\n（需其他玩家也已结束本局才会生效）',
                  "Setting sail again resets everyone to Round 1. Continue?\n(Takes effect only once every other player's game is also over.)"))) return;
  sendAction('restart');
}

/* ---------- Ending the session early, with everyone's consent ---------- */
function confirmEndSession() {
  if (serverState && serverState.youVotedEnd) return; // already voted; nothing more to confirm
  if (!confirm(tr('结束会话将使全员返回大厅，且无法恢复本局进度。需所有玩家都同意才会生效，确定要发起吗？',
                  "Ending the session sends everyone back to the lobby, and this voyage can't be resumed. It only takes effect once every player agrees. Propose it now?"))) return;
  sendAction('end_session');
}

function renderEndSessionButton() {
  const btn = document.getElementById('btn-end-session');
  if (!btn) return;
  const s = serverState;
  const votes = (s && s.endSessionVotes) || 0;
  const total = (s && s.endSessionTotal) || 0;
  if (s && s.youVotedEnd) {
    btn.disabled = true;
    btn.textContent = tr(`⏳ 等待同意 (${votes}/${total})`, `⏳ Waiting for agreement (${votes}/${total})`);
    btn.title = tr('已同意结束，等待其他玩家', "You've agreed to end the session; waiting on everyone else");
    return;
  }
  btn.disabled = false;
  // Showing the live count even before you've voted yourself is the whole point: a vote
  // that's invisible to everyone except whoever already clicked isn't really a consensus
  // mechanism, just a guessing game.
  btn.textContent = votes > 0
    ? tr(`🚪 结束会话 (${votes}/${total} 已同意)`, `🚪 End Session (${votes}/${total} agreed)`)
    : tr('🚪 结束会话', '🚪 End Session');
  btn.title = tr('提议结束本局并返回大厅，需全员同意', 'Propose ending this session and returning to the lobby; everyone must agree');
}

/* ---------- Bottom action bar ---------- */
function renderControls() {
  const g = serverState && serverState.yourGame;
  const c = document.getElementById('control-panel');
  if (!g || g.gameOver) {
    const isBankrupt = g && g.bankrupt;
    const anyoneElsePlaying = Object.values(serverState.otherGames || {}).some(og => !og.gameOver);
    c.innerHTML = `
      <span class="sync-chip">${isBankrupt ? tr('💥 船队破产', '💥 Fleet Bankrupt') : tr('🏁 本局已结束', '🏁 Game Over')}</span>
      ${anyoneElsePlaying ? `<span class="control-hint">${tr('💡 还有同行仍在航行中，可打开观战窗口实时围观', "💡 Others are still sailing. Open the spectator window to watch live")}</span>` : ''}
      <div class="control-spacer"></div>
      ${isBankrupt && anyoneElsePlaying ? `<button class="btn btn-ghost" onclick="openCaptainViewer()">${tr('👀 观战同行', '👀 Spectate')}</button>` : ''}
      <button class="btn btn-danger" onclick="confirmRestart()">${tr('🔄 重新起航', '🔄 Set Sail Again')}</button>
      <button class="btn btn-ghost" onclick="showManual()">${tr('📖 手册', '📖 Manual')}</button>`;
    return;
  }
  const phase = g.phase;
  const readyCount = serverState.phaseReadyCount || 0;
  const totalCount = serverState.phaseTotalCount || 2;

  let primary = '';
  let hint = '';
  if (phase === 0) {
    primary = serverState.youReady
      ? `<button class="btn btn-grey btn-lg" disabled>${tr('⌛ 已确认，等待其他人', '⌛ Confirmed: waiting for others')}</button>`
      : `<button class="btn btn-success btn-lg" onclick="sendAction('startBoon')">${tr('🧭 扬帆起航，抽取福缘', '🧭 Set Sail & Draw Fortunes')}</button>`;
    hint = serverState.youReady ? tr('等待其他人确认后进入福缘抽取', 'Waiting for everyone else to confirm') : tr('全员都确认后进入福缘抽取', 'Fortune draw begins once everyone confirms');
  } else if (phase === 5) {
    hint = tr('请在上方卡片中选择并锁定一项福缘', 'Pick and lock one fortune card above');
  } else if (phase === 1) {
    primary = `<button class="btn btn-lg" onclick="sendAction('ready_for_next_phase')">${tr('✅ 完成采购', '✅ Done Procuring')}</button>`;
    hint = tr('采购完成后确认，全员就绪即进入互市', 'Confirm when done buying. Barter starts when everyone is ready');
  } else if (phase === 'trade') {
    hint = tr('在互市界面发布/响应交易，谈妥后点「准备就绪」', 'Post or answer offers above, then click Ready when trades are settled');
  } else if (phase === 'worker_mgmt') {
    primary = `<button class="btn btn-lg" onclick="sendAction('ready_for_next_phase')">${tr('✅ 完成工匠管理', '✅ Done Managing')}</button>`;
    hint = tr('雇佣并指派任务后确认', 'Hire and assign tasks, then confirm');
  } else if (phase === 2) {
    primary = `<button class="btn btn-lg" onclick="sendAction('ready_for_next_phase')">${tr('✅ 完成交易', '✅ Done Trading')}</button>`;
    hint = tr('交付订单后确认，进入结算', 'Deliver your orders, then confirm to enter Upkeep');
  } else if (phase === 3) {
    primary = `<button class="btn btn-warning btn-lg" onclick="sendAction('doMaintenance')">${tr('💸 支付维护费', '💸 Pay Upkeep')}</button>`;
    hint = tr('支付后等待其他人完成结算', 'After paying, wait for everyone else to settle');
  } else if (phase === 4) {
    primary = `<button class="btn btn-success btn-lg" onclick="sendAction('ready_for_next_phase')">${tr('⏭️ 结束航程', '⏭️ End Voyage')}</button>`;
    hint = tr('可先升级商船，再结束本航程', 'Upgrade your ship first if you like, then end the voyage');
  }

  c.innerHTML = `
    <span class="sync-chip" title="${tr('全员确认后才会进入下一阶段', 'The next phase starts once everyone confirms')}">${tr(`🔄 全员就绪 ${readyCount} / ${totalCount}`, `🔄 Ready ${readyCount} / ${totalCount}`)}</span>
    <span class="control-hint">💡 ${hint}</span>
    <div class="control-spacer"></div>
    ${primary}
    <button class="btn btn-ghost" onclick="showManual()" title="${tr('快捷键 F1', 'Shortcut: F1')}">${tr('📖 手册', '📖 Manual')}</button>
  `;
}

function renderLog() {
  const logs = (serverState && serverState.yourGame && serverState.yourGame.logs) || [];
  const l = document.getElementById('log-panel');
  l.innerHTML = `<div class="log-title">${tr('📜 航海日志 · 最近操作记录', "📜 Captain's Log · Recent Actions")}</div>` +
    (logs.length
      ? logs.map(m => `<div class="log-entry">${escapeHtml(lst(m))}</div>`).join('')
      : `<div class="log-entry muted">${tr('暂无记录。你的采购、交易、生产等操作会记录在这里。', 'Nothing yet. Your purchases, trades and production will be recorded here.')}</div>`);
  l.scrollTop = l.scrollHeight;
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function sendAction(action, payload = {}) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ action, ...payload }));
  }
}

let activeManualTab = 'start';

function showManual(tab) {
  activeManualTab = tab || activeManualTab || 'start';
  showModal(`
    <h2>${tr('📖 PortMasters 2 · 航海手册', "📖 PortMasters 2 · Captain's Manual")}</h2>
