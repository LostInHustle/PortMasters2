    </div>
    <div class="manual-body" id="manual-body">${manualContent(activeManualTab)}</div>
    <div style="text-align:center;margin-top:16px">
      <button class="btn" onclick="closeModal()">${tr('关闭（Esc）', 'Close (Esc)')}</button>
    </div>
  `, true);
}

function switchManualTab(tab) {
  activeManualTab = tab;
  document.querySelectorAll('.mtab').forEach(b => b.classList.remove('active'));
  const idx = manualTabs().findIndex(t => t.id === tab);
  if (idx >= 0) document.querySelectorAll('.mtab')[idx].classList.add('active');
  document.getElementById('manual-body').innerHTML = manualContent(tab);
}

      <h4>${tr('3️⃣ 生产成品才赚大钱', '3️⃣ Real money is in finished goods')}</h4>
      <p>${tr('雇工匠把原料加工成成品（香囊市价 95-120！），再交付订单。注意成品要缴约 5% 增值税，回合末还有约 10% 所得税。',
        'Hire artisans to turn materials into products (Sachets fetch 95-120!) and deliver them on orders. Mind the ~5% VAT on products and ~10% income tax at round end.')}</p>
      <div class="pm-banner">
        <span class="pm-icon">💡</span>
        <span>${tr(`本作上手门槛较高。若中途感到吃力，可先体验
        <a href="${pm1Url()}" target="_blank" rel="noopener">${pm1Label()}</a>，再回来挑战。`,
        `The learning curve here is steep. If it gets overwhelming, warm up with
        <a href="${pm1Url()}" target="_blank" rel="noopener">${pm1Label()}</a> and come back.`)}</span>
      </div>
    </div>
    <div style="text-align:center;margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-success btn-lg" onclick="finishOnboarding(false)">${tr('⚓ 我已了解，开始航行', "⚓ Got it, let's sail")}</button>
      <button class="btn btn-gold btn-lg" onclick="finishOnboarding(true)">${tr('📖 先看完整手册', '📖 Read the full manual first')}</button>
    </div>
  `, true);
}

function finishOnboarding(openManual) {
  localStorage.setItem('pm2_onboarded', '1');
  closeModal();
  if (openManual) showManual('start');
}

/* ---------- Generic dialogs ---------- */
function showModal(html, wide) {
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal ${wide ? 'modal-wide' : ''}">
        <button class="modal-x" onclick="closeModal()" title="${tr('关闭（Esc）', 'Close (Esc)')}">×</button>
        ${html}
      </div>
    </div>`;
}

function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

/* ---------- Global keyboard shortcuts (user freedom and control: get help anytime, exit overlays anytime) ---------- */
document.addEventListener('keydown', e => {
  if (e.key === 'F1') {
    e.preventDefault();
    showManual();
  } else if (e.key === 'Escape') {
    if (document.getElementById('modal-root').innerHTML) {
      closeModal();
    } else if (_viewerOpen) {
      closeCaptainViewer();
    } else if (document.getElementById('chat-window').style.display === 'flex') {
      toggleChat();
    }
  }
});

/* ---------- Tooltips: one shared, viewport-aware bubble (see the .tip-bubble CSS note) ----------
   Delegated from `document`, so re-rendered phase panels never need re-binding and every
   current/future [data-tip] element is covered with zero markup churn. The bubble is a
   direct child of <body> (which has no transform/filter), so position:fixed is measured
   against the viewport and no ancestor overflow or stacking context can clip it. */
function initTooltips() {
  const GAP = 9;       // breathing room between the element and the bubble
  const MARGIN = 8;    // minimum distance the bubble keeps from any viewport edge
  const bubble = document.createElement('div');
  bubble.className = 'tip-bubble tip-hidden';
  bubble.setAttribute('role', 'tooltip');
  document.body.appendChild(bubble);

  let current = null;

  function show(el) {
    const text = el.getAttribute('data-tip');
    if (!text) return;
    current = el;
    bubble.textContent = text;             // text only, mirroring the old attr(data-tip); prevents HTML injection
    bubble.classList.remove('tip-hidden');  // must be displayed to be measured

    // max-width is fixed, so wrapping (and thus height) is identical wherever we place it.
    const a = el.getBoundingClientRect();
    const b = bubble.getBoundingClientRect();
    const vw = document.documentElement.clientWidth;
    const vh = document.documentElement.clientHeight;

    // Vertical placement: prefer above; flip below only when there is no room above but room below.
    let placement = 'above';
    let top = a.top - GAP - b.height;
    if (top < MARGIN && a.bottom + GAP + b.height <= vh - MARGIN) {
      placement = 'below';
      top = a.bottom + GAP;
    }
    top = Math.max(MARGIN, Math.min(top, vh - MARGIN - b.height));

    // Horizontal placement: centre on the element, then clamp the whole bubble inside the viewport.
    const anchorCenter = a.left + a.width / 2;
    let left = Math.max(MARGIN, Math.min(anchorCenter - b.width / 2, vw - MARGIN - b.width));

    bubble.style.top = Math.round(top) + 'px';
    bubble.style.left = Math.round(left) + 'px';
    bubble.dataset.placement = placement;
    // Keep the caret pointing at the element even after the bubble was clamped sideways.
    const caret = Math.max(11, Math.min(anchorCenter - left, b.width - 11));
    bubble.style.setProperty('--tip-caret', Math.round(caret) + 'px');

    requestAnimationFrame(() => bubble.classList.add('tip-show'));
  }

  function hide() {
    current = null;
    bubble.classList.remove('tip-show');
    bubble.classList.add('tip-hidden');
  }

  // closest() lets inner icons/text inside a .tip element trigger their parent's hint.
  document.addEventListener('pointerover', e => {
    const el = e.target.closest('[data-tip]');
    if (el && el !== current) show(el);
  });
  document.addEventListener('pointerout', e => {
    const el = e.target.closest('[data-tip]');
    if (!el || el !== current) return;
    if (e.relatedTarget && el.contains(e.relatedTarget)) return; // moving within the same element
    hide();
  });
  // A fixed bubble can't track a scrolling/resizing anchor, so hide it before it floats detached.
  window.addEventListener('scroll', () => { if (current) hide(); }, true);
  window.addEventListener('resize', () => { if (current) hide(); });
}
initTooltips();

/* Startup: fill in all static UI text according to the persisted language preference (default English) */
applyLanguage();
</script>
